model:
  arch: blip_pretrain_vit

  model_type: fvlp # configs/models/blip_pretrain_ct.yaml
  ckpt_path:
  load_pretrained: False
  load_finetuned: False
  
  max_txt_len: 384
  max_txt_len_conc: 200
  max_txt_len_desc: 200

  queue_size: 0
  alpha: 0.5

datasets:
  coco_caption: # this is used for process the ct-rate data, encapsulated in the coco caption format
    vis_processor:
        train:
          name: "blip_image_train"
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"

run:
  task: image_text_pretrain
  # optimizer
  # lr_sched: "linear_warmup_step_lr"
  # lr_decay_rate: 0.9
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 1e-6
  warmup_lr: 1e-4 # warm up learning = init_lr => just finetuning without warm up

  weight_decay: 0.05
  max_epoch: 100 # maximum is 8 on the cluster
  batch_size_train: 8
  batch_size_eval: 8
  num_workers: 10 
  warmup_steps: 0 # 377 since we just finetune, we don't need warmup 
  log_freq: 1

  seed: 42
  output_dir: "/cluster/projects/mcintoshgroup/fvlm_files/train_outputs"

  amp: False
  # best checkpoint path
  resume_ckpt_path: '/cluster/projects/mcintoshgroup/fvlm_files/fvlm_weights/checkpoints/model.pth'


  evaluate: False
  train_splits: ["train"]
  # NOTE there is no evaluation split. use the eval script to do the evaluation

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
