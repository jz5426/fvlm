model:
  arch: blip_pretrain

  load_pretrained: False # since we initialize from pretrained checkpoint
  pretrained: "/cluster/projects/mcintoshgroup/fvlm_files/fvlm_weights/model_base_capfilt_large.pth"

  vit_type: "base"
  vit_grad_ckpt: False
  vit_ckpt_layer: 0

  image_size: 224
  alpha: 0.5

  # bert config
  med_config_path:  "/cluster/projects/mcintoshgroup/fvlm_files/fvlm_weights/BiomedVLP-CXR-BERT-specialized/config.json"

  embed_dim: 256

  # generation configs
  prompt: "a picture of "

preprocess:
    vis_processor:
        train:
          name: "blip_image_train"
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"
